name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atrium
          POSTGRES_PASSWORD: atrium
          POSTGRES_DB: atrium
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atrium" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://atrium_app:atrium_app@localhost:5432/atrium
      DATABASE_ADMIN_URL: postgres://atrium:atrium@localhost:5432/atrium
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:deps
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun run test
