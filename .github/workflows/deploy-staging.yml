name: Deploy staging
# Every merge to main goes to staging once CI is green on that commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
